name: Keep Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: >-
          curl --fail --silent --show-error --max-time 90
          --retry 2 --retry-delay 5
          https://medical-diagnosis-ml-1.onrender.com/api/health-check
